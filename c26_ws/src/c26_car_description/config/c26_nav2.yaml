amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    min_particles: 300
    max_particles: 1200
    update_min_d: 0.05
    update_min_a: 0.10
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      cost_travel_multiplier: 4.0
      allow_unknown: false
      tolerance: 0.12

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    controller_frequency: 12.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    costmap_update_timeout: 0.6
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath, CardinalDWB]
    path_handler_plugins: [PathHandler]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.10
      required_movement_angle: 0.20
      movement_time_allowance: 12.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.22
      yaw_goal_tolerance: 0.25
      stateful: true
    PathHandler:
      plugin: nav2_controller::FeasiblePathHandler
      prune_distance: 2.0
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      angular_dist_threshold: 0.85
      angular_disengage_threshold: 0.32
      forward_sampling_distance: 0.30
      rotate_to_heading_angular_vel: 0.70
      max_angular_accel: 1.6
      closed_loop: false
      rotate_to_goal_heading: true
      primary_controller:
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        max_linear_vel: 0.25
        lookahead_dist: 0.32
        use_velocity_scaled_lookahead_dist: false
        use_rotate_to_heading: false
        max_angular_accel: 1.6
        min_approach_linear_velocity: 0.06
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        use_cost_regulated_linear_velocity_scaling: true
        inflation_cost_scaling_factor: 3.0
    CardinalDWB:
        plugin: dwb_core::DWBLocalPlanner
        min_vel_x: -0.10
        max_vel_x: 0.28
        min_vel_y: -0.22
        max_vel_y: 0.22
        max_vel_theta: 0.75
        min_speed_xy: 0.0
        max_speed_xy: 0.30
        min_speed_theta: 0.0
        acc_lim_x: 1.0
        acc_lim_y: 1.0
        acc_lim_theta: 1.8
        decel_lim_x: -1.0
        decel_lim_y: -1.0
        decel_lim_theta: -1.8
        vx_samples: 9
        vy_samples: 7
        vtheta_samples: 13
        sim_time: 2.0
        linear_granularity: 0.04
        angular_granularity: 0.08
        xy_goal_tolerance: 0.22
        trans_stopped_velocity: 0.05
        short_circuit_trajectory_evaluation: true
        stateful: true
        critics: [c26_car_description::CardinalMotionCritic, RotateToGoal, Oscillation, ObstacleFootprint, BaseObstacle, PathDist, GoalDist]
        c26_car_description::CardinalMotionCritic:
          scale: 1.0
        Oscillation.oscillation_reset_time: 1.5
        BaseObstacle.scale: 0.18
        PathDist.scale: 38.0
        GoalDist.scale: 18.0
        RotateToGoal.scale: 30.0
        RotateToGoal.slowing_factor: 4.0
        RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.04
      update_frequency: 8.0
      publish_frequency: 3.0
      footprint: '[[0.15, 0.13], [0.15, -0.13], [-0.15, -0.13], [-0.15, 0.13]]'
      always_send_full_costmap: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 4.0
          raytrace_max_range: 6.5
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.46
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.04
      track_unknown_space: true
      update_frequency: 3.0
      publish_frequency: 1.0
      footprint: '[[0.15, 0.13], [0.15, -0.13], [-0.15, -0.13], [-0.15, 0.13]]'
      always_send_full_costmap: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 4.0
          raytrace_max_range: 6.5
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.46
        cost_scaling_factor: 3.0

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    behavior_plugins: [spin, backup, wait]
    spin: {plugin: 'nav2_behaviors::Spin'}
    backup: {plugin: 'nav2_behaviors::BackUp'}
    wait: {plugin: 'nav2_behaviors::Wait'}
    max_rotational_vel: 0.75
    min_rotational_vel: 0.30

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_name_prefixes: [backup, compute_path, follow_path, spin, wait]
